<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Multiplayer Shooter</title>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script>
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  platforms.forEach(p => {
    if (p.moveType === 'horizontal') {
      p.x += 0.4 * p.direction;
      if (!p.originalX) p.originalX = p.x;
      if (Math.abs(p.x - p.originalX) > 200 || p.x <= 0 || p.x + p.width >= canvas.width) p.direction *= -1;
    } else if (p.moveType === 'vertical') {
      p.y += 0.4 * p.direction;
      if (!p.originalY) p.originalY = p.y;
      if (Math.abs(p.y - p.originalY) > 200 || p.y <= 0 || p.y + p.height >= canvas.height) p.direction *= -1;
    }
    ctx.fillStyle = '#888';
    ctx.fillRect(p.x, p.y, p.width, p.height);
  });

  if (myPlayer) {
    if (!gameOver) myPlayer.update();
    myPlayer.draw();
  }

  Object.values(remotePlayers).forEach(p => {
    if (p.alive) p.draw();
  });

  bullets.forEach((b, i) => {
    b.x += b.vx;
    const hitPlatform = platforms.some(p =>
      b.x < p.x + p.width && b.x + 8 > p.x && b.y < p.y + p.height && b.y + 4 > p.y
    );
    if (hitPlatform) return;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, 8, 4);
    if (myPlayer && b.color !== myColor && myPlayer.alive) {
      const hit = b.x < myPlayer.x + myPlayer.width && b.x + 8 > myPlayer.x && b.y < myPlayer.y + myPlayer.height && b.y + 4 > myPlayer.y;
      if (hit) gameRef.child(`players/${myColor}/alive`).set(false);
    }
  });

  const alivePlayers = Object.values(players || {}).filter(p => p.alive);
  if (gameRunning && alivePlayers.length === 1) {
    gameRunning = false;
    gameOver = true;
    winnerMessage = `${alivePlayers[0].name} wins! Press Enter to restart.`;
    gameStateRef.set({ running: false });
    boxShrinkActive = false;
    fadeOutAlpha = 0.3;
    box = { x: 0, y: 0, width: canvas.width, height: canvas.height };
  }

  if (gameOver && winnerMessage) {
    ctx.fillStyle = 'white';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(winnerMessage, canvas.width / 2, canvas.height / 2);
  
  }

  if (!gameRunning && countdownActive && countdown > 0) {
    ctx.fillStyle = 'white';
    ctx.font = '24px sans-serif';
    ctx.fillText(`Players: ${Object.keys(players).length}`, canvas.width / 2, canvas.height / 2 - 40);
    ctx.fillStyle = 'white';
    ctx.font = '36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Game starting in ${countdown}...`, canvas.width / 2, canvas.height / 2);
  } else if (!gameRunning && !countdownActive) {
    ctx.fillStyle = 'white';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    const text = Object.keys(players).length < 2 ?
      'Waiting for at least 1 more player to join the game...' :
      `${players['red']?.name || 'Player 1'} must press Enter to start the game...`;
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  } if (gameRunning && !shrinkTimerStarted) {
    shrinkStartTime = Date.now();
    shrinkTimerStarted = true;
  }

  if (shrinkTimerStarted && !boxShrinkActive) {
    const timeElapsed = Date.now() - shrinkStartTime;
    if (timeElapsed > 7000 && !warningActive) warningActive = true;
    if (timeElapsed > 10000) {
      boxShrinkActive = true;
      warningActive = false;
    }
  }

  if (boxShrinkActive) {
    if (box.width > 300) box.width -= 0.2;
    if (box.height > 200) box.height -= 0.1;
    box.x = (canvas.width - box.width) / 2;
    box.y = (canvas.height - box.height) / 2;

    if (myPlayer && (myPlayer.x < box.x || myPlayer.x + myPlayer.width > box.x + box.width || myPlayer.y < box.y || myPlayer.y + myPlayer.height > box.y + box.height)) {
      gameRef.child(`players/${myColor}/alive`).set(false);
    }

    ctx.fillStyle = `rgba(255, 0, 0, ${fadeOutAlpha.toFixed(2)})`;
    ctx.fillRect(0, 0, canvas.width, box.y);
    ctx.fillRect(0, box.y + box.height, canvas.width, canvas.height - box.y - box.height);
    ctx.fillRect(0, box.y, box.x, box.height);
    ctx.fillRect(box.x + box.width, box.y, canvas.width - box.x - box.width, box.height);

    ctx.strokeStyle = 'red';
    ctx.lineWidth = 4;
    ctx.globalAlpha = fadeOutAlpha;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
    ctx.globalAlpha = 1.0;
  }

  if (fadeOutAlpha > 0 && gameOver) fadeOutAlpha -= 0.01;
else if (boxShrinkActive && fadeOutAlpha <= 0.3) fadeOutAlpha = 0.3;

  if (warningActive) {
    warningFlashing = Math.floor(Date.now() / 500) % 2 === 0;
    if (warningFlashing) {
      ctx.fillStyle = 'red';
      ctx.font = '48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('WARNING!', canvas.width / 2, 80);
    }
  }

  requestAnimationFrame(gameLoop);
}
</script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-database-compat.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1e1e1e;
    }
    canvas {
      display: block;
      margin: auto;
      background: #333;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" style="z-index: 0; position: relative;" tabindex="0" width="800" height="450"></canvas>
  <div id="nameInputUI" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; background: rgba(0, 0, 0, 0.8); padding: 20px; color: white; font-size: 18px; border-radius: 8px;">
    <label for="playerNameInput">Enter your name:</label><br>
    <input id="playerNameInput" type="text" maxlength="12" style="font-size: 18px; margin-top: 10px;" />
    <button id="submitNameBtn" style="font-size: 18px; margin-left: 10px;">Join</button>
  </div>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const GRAVITY = 0.6;
    const FRICTION = 0.8;
    let keys = {};
    let myColor = null;
    let myPlayer = null;
    let players = {};
    let bullets = [];
    let remotePlayers = {};
    let countdown = 5;
    let countdownActive = false;
    let gameOver = false;
    let gameRunning = false;
    let playerName = "";
    let winnerMessage = "";
    let platforms = [];
    let shrinkTimerStarted = false;
    let shrinkStartTime = 0;
    let boxShrinkActive = false;
    let fadeOutAlpha = 0;
    let warningActive = false;
    let warningFlashing = false;
    let box = { x: 0, y: 0, width: canvas.width, height: canvas.height };

    const firebaseConfig = {
      apiKey: "AIzaSyC5GHKh7sK9y02GMKjQGiRWtdPEOaev_gU",
      authDomain: "online-multiplayer-test.firebaseapp.com",
      projectId: "online-multiplayer-test",
      storageBucket: "online-multiplayer-test.appspot.com",
      messagingSenderId: "467346612454",
      appId: "1:467346612454:web:82189732533d30d0489b27",
      databaseURL: "https://online-multiplayer-test-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gameRef = db.ref("games/game1");
    const gameStateRef = gameRef.child("state");

    function generatePlatforms() {
      const num = 7;
      platforms = [];
      for (let i = 0; i < num; i++) {
        let width = 120;
        let height = 15;
        let x = Math.random() * (canvas.width - width);
        let yBand;
        if (i < 3) yBand = [canvas.height - 120, canvas.height - 70];
        else if (i < 5) yBand = [canvas.height / 2 - 10, canvas.height / 2 + 50];
        else yBand = [80, 140];
        let y = Math.random() * (yBand[1] - yBand[0]) + yBand[0];
        let tooClose = platforms.some(p =>
          Math.abs(p.x - x) < 150 && Math.abs(p.y - y) < 80
        );
        if (!tooClose) {
          let moveTypes = ["none", "horizontal", "vertical"];
          platforms.push({ x, y, width, height, moveType: moveTypes[Math.floor(Math.random() * 3)], direction: 1 });
        } else {
          i--;
        }
      }
    }
    generatePlatforms();

    class Player {
      constructor(color, name) {
        this.color = color;
        this.name = name;
        this.x = color === 'red' ? 100 : 650;
        this.y = 400;
        this.vx = 0;
        this.vy = 0;
        this.width = 40;
        this.height = 40;
        this.onGround = false;
        this.canJump = true;
    this.jumping = false;
    this.jumpHoldTime = 0;
        this.cooldown = 0;
        this.alive = true;
        this.lastDirection = 'right';
        this.recoilFrame = 0;
      }
      update() {
        if (!this.alive) return;
        if (keys['ArrowLeft']) {
          this.vx -= 1.0;
          this.lastDirection = 'left';
        }
        if (keys['ArrowRight']) {
          this.vx += 1.0;
          this.lastDirection = 'right';
        }
        if (this.onGround && keys['ArrowUp'] && this.canJump) {
          this.vy = -6;
          this.jumpHoldTime = 0;
          this.jumping = true;
          this.onGround = false;
          this.canJump = false;
        }
        this.vx *= FRICTION;
        if (this.jumping && keys['ArrowUp'] && this.jumpHoldTime < 15) {
          this.vy -= 0.7;
          this.jumpHoldTime++;
        } else {
          this.jumping = false;
        }
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
        this.onGround = false;
        if (this.y + this.height > canvas.height) {
          this.y = canvas.height - this.height;
          this.vy = 0;
          this.onGround = true;
        }
        platforms.forEach(p => {
          const isOnTop = this.y + this.height > p.y && this.y + this.height < p.y + p.height && this.x + this.width > p.x && this.x < p.x + p.width && this.vy >= 0;
          if (isOnTop) {
            this.y = p.y - this.height;
            this.vy = 0;
            this.onGround = true;
            if (p.moveType === 'horizontal') this.x += p.direction * 0.4;
            if (p.moveType === 'vertical') this.y += p.direction * 0.4;
          }
        });
        if (this.x + this.width < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = -this.width;
        if (keys[' '] && this.cooldown <= 0 && gameRunning && this.alive) {
          const bulletRef = gameRef.child("bullets").push();
          bulletRef.set({
            x: this.x + this.width / 2,
            y: this.y + 10,
            vx: this.lastDirection === 'right' ? 8 : -8,
            color: this.color,
            name: this.name
          });
          this.cooldown = 20;
          this.recoilFrame = 3;
        }
        if (this.cooldown > 0) this.cooldown--;
        gameRef.child(`players/${this.color}`).set({
          name: this.name,
          x: this.x,
          y: this.y,
          alive: this.alive,
          lastDirection: this.lastDirection
        });
      }
      draw() {
        if (!this.alive) return;
        ctx.fillStyle = this.color;
        let recoilOffset = this.recoilFrame ? (this.lastDirection === 'right' ? -4 : 4) : 0;
        ctx.fillRect(this.x + recoilOffset, this.y, this.width, this.height);
        if (this.recoilFrame) this.recoilFrame--;
        ctx.fillStyle = 'white';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, this.x + this.width / 2, this.y - 5);
      }
    }

    function init() {
  gameRef.child("players").once("value").then(snapshot => {
    players = snapshot.val() || {};
    const takenColors = Object.keys(players);
    const allColors = ["red", "blue", "green", "yellow", "purple", "orange", "cyan", "pink"];
    const availableColors = allColors.filter(c => !takenColors.includes(c));
    if (availableColors.length === 0) {
      alert("Game full. Only 8 players allowed.");
      return;
    }
    myColor = availableColors[0];
    myPlayer = new Player(myColor, playerName);
    const playerRef = gameRef.child(`players/${myColor}`);
    playerRef.onDisconnect().remove();
    playerRef.set({
      name: myPlayer.name,
      x: myPlayer.x,
      y: myPlayer.y,
      alive: myPlayer.alive,
      lastDirection: myPlayer.lastDirection
    });
    gameRef.child("players").on("value", snap => {
      const updatedPlayers = snap.val() || {};
      const currentRemoteColors = new Set(Object.keys(updatedPlayers));
      Object.entries(updatedPlayers).forEach(([color, data]) => {
        if (color !== myColor) {
          if (!remotePlayers[color]) {
            remotePlayers[color] = new Player(color, data.name || color);
          }
          const p = remotePlayers[color];
          p.x = data.x;
          p.y = data.y;
          p.alive = data.alive;
          p.lastDirection = data.lastDirection;
        } else if (myPlayer) {
          myPlayer.alive = data.alive;
        }
      });
      Object.keys(remotePlayers).forEach(color => {
        if (!currentRemoteColors.has(color)) {
          delete remotePlayers[color];
        }
      });
      players = updatedPlayers;
    });
    gameRef.child("bullets").on("child_added", snap => {
      const b = snap.val();
      bullets.push({ x: b.x, y: b.y, vx: b.vx, color: b.color, name: b.name });
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && gameOver) {
        gameRef.remove().then(() => location.reload());
      } else if (e.key === 'Enter' && !gameRunning && !countdownActive && myColor === 'red' && Object.keys(players).length >= 2) {
        countdownActive = true;
        countdown = 5;
        let interval = setInterval(() => {
          countdown--;
          if (countdown <= 0) {
            clearInterval(interval);
            gameStateRef.set({ running: true });
          }
        }, 1000);
      }
    });
    gameStateRef.on("value", snap => {
      const state = snap.val();
      gameRunning = state?.running || false;
    });
    gameLoop();
  });
}

document.getElementById("submitNameBtn").onclick = () => {
  const input = document.getElementById("playerNameInput").value.trim();
  playerName = input || "Anonymous";
  document.getElementById("nameInputUI").style.display = "none";
  document.getElementById("gameCanvas").focus();
  init();
};

canvas.addEventListener('click', () => canvas.focus());

window.addEventListener('keydown', e => {
  if (e.code === 'Space') e.preventDefault();
  keys[e.key] = true;
  if (e.key === 'Escape') {
    gameRef.remove().then(() => {
      remotePlayers = {};
      players = {};
      bullets = [];
      myPlayer = null;
      gameRunning = false;
      countdownActive = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      location.reload();
    });
  }
});

window.addEventListener('keyup', e => {
  keys[e.key] = false;
  if (e.key === 'ArrowUp' && myPlayer) {
    myPlayer.canJump = true;
  }
});
  </script>
</body>
</html>
